[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-cli-no-admin"
version = "2026.8.3"
description = 'Use the Django CLI using "django" without typing "django-admin"'
authors = [
    { name = "Jeff Triplett", email = "jeff.triplett@gmail.com" }
]
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    "django"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
readme = { file = "README.md", content-type="text/markdown" }

[project.scripts]
django = "django.core.management:execute_from_command_line"

[project.urls]
Changelog = "https://github.com/jefftriplett/django-cli-no-admin/releases"
Documentation = "https://github.com/jefftriplett/django-cli-no-admin"
"Fiscal support" = "https://github.com/sponsors/jefftriplett/"
Homepage = "https://jefftriplett.com"
Source = "https://github.com/jefftriplett/django-cli-no-admin"

[tool.bumpver]
current_version = "2026.8.3"
version_pattern = "YYYY.MM.INC1"
commit_message = ":gem: Bump version to {new_version}"
commit = false  # handled by justfile
push = false  # handled by justfile
tag = false  # handled by justfile

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
